name: Verify and deploy WordyLand
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = publish main again; probe = read-only SSH check; rollback = restore previous files; health = one public HTTPS GET only'
        type: choice
        options: [deploy, probe, rollback, health]
        default: deploy
      backup:
        description: 'Backup name for rollback (or latest)'
        type: string
        default: latest
permissions:
  contents: read
concurrency:
  # One production operation at a time; queued runs are never cancelled mid-deploy.
  group: ${{ github.event_name == 'pull_request' && format('wordyland-pr-{0}', github.ref) || 'wordyland-production' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check application JavaScript and shell scripts
        run: |
          shopt -s nullglob
          for f in dist/*.js dist/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
          node scripts/test-lessons.mjs
          node scripts/test-pwa.mjs
          node scripts/test-learning.mjs
          node scripts/test-rewards.mjs
      - name: Verify account API and database isolation
        run: |
          for f in dist/*.php; do php -l "$f"; done
          python3 scripts/test-api.py
          python3 scripts/test-access.py
          python3 scripts/test-email-recovery.py
          python3 scripts/test-classroom.py
          python3 scripts/test-adventures.py
          php -l scripts/bootstrap-admin.php
          php -l scripts/owner-recovery-status.php
          php -l scripts/prepare-owner-recovery.php
          php -l scripts/read-only-readiness.php
          python3 scripts/test-read-only-readiness.py
          python3 scripts/test-owner-recovery.py
          php -l scripts/siteground-cache.php
          python3 scripts/test-cache-purge.py
          python3 scripts/test-community.py
          python3 scripts/test-presence.py
          python3 scripts/test-resume.py
          python3 scripts/test-autonomy.py
          python3 scripts/test-review.py
          python3 scripts/test-choice-fairness.py
          python3 scripts/test-parent-summary.py
          python3 scripts/test-training.py
          python3 scripts/test-phonics.py
          python3 scripts/test-letter-progression.py
      - name: Check public bundle
        run: node scripts/verify-bundle.mjs
      - name: Test deployment script in isolation
        run: bash scripts/test-deploy.sh

  browser:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    # Slow Ubuntu mirrors previously consumed12minutes before the suites began.
    # Keep test execution separately bounded; do not spend its budget on setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright package
        timeout-minutes: 3
        run: npm install --prefix /tmp/wordyland-browser-deps --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium system dependencies
        timeout-minutes: 15
        run: /tmp/wordyland-browser-deps/node_modules/.bin/playwright install-deps chromium
      - name: Install pinned Chromium
        timeout-minutes: 3
        run: /tmp/wordyland-browser-deps/node_modules/.bin/playwright install chromium
      - name: Verify child journeys in isolated browsers
        timeout-minutes: 8
        env:
          WORDYLAND_PLAYWRIGHT_MODULE: /tmp/wordyland-browser-deps/node_modules/playwright
        run: |
          export WORDYLAND_CHROMIUM=$(node -p "require(process.env.WORDYLAND_PLAYWRIGHT_MODULE).chromium.executablePath()")
          for check in pdf-scan ocr materials duel-resilience compatibility ux learning resume presence community pwa rewards motion access email performance navigation autonomy review wardrobe parent-summary tiles wallet training spelling letter-progression foundations offline-training offline-letters phonics; do bash scripts/test-browser.sh "$check"; done

  deploy:
    needs: [verify, browser]
    if: >-
      github.ref == 'refs/heads/main' && vars.SG_PATH != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deploy tested commit to SiteGround and verify the live site
        run: bash scripts/deploy-siteground.sh deploy

  probe:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner network
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
      - name: Read-only SSH check (host keys, path, PHP)
        run: bash scripts/deploy-siteground.sh probe

  hostkey-crosscheck:
    # Independent network vantage points for the SSH host key (no credentials used).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_PORT: ${{ vars.SG_PORT }}
    steps:
      - name: Scan host key fingerprints from ${{ matrix.os }}
        shell: bash
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
          ssh-keyscan -T 20 -p "$SG_PORT" "$SG_HOST" 2>/dev/null > scan.txt
          ssh-keygen -lf scan.txt

  rollback:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback' && vars.SG_PATH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
      BACKUP_NAME: ${{ inputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore previous application files (database untouched)
        run: bash scripts/deploy-siteground.sh rollback "$BACKUP_NAME"

  health:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'health' && github.ref == 'refs/heads/health-public-readonly-2026-11-01' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: One public HTTPS health GET; no SSH or deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          
          result = {"httpStatus": None, "contentType": "unknown", "jsonValid": False,
                    "ready": False, "databaseSqlite": False, "transportOk": False}
          
          def reject_constant(value):
              raise ValueError("Non-JSON constant")
          
          try:
              with tempfile.TemporaryDirectory(prefix="wordyland-health-") as directory:
                  body = pathlib.Path(directory) / "body"
                  # Ordinary curl GET; one invocation, no redirect/retry/cookie/custom UA.
                  url = "https://wordyland.eu/api.php?action=health&verify-" + os.environ["GITHUB_RUN_ID"]
                  response = subprocess.run(
                      ["curl", "-q", "-sS", "--max-time", "30", "--max-filesize", "65536",
                       "-o", str(body), "-w", "%{http_code}\n%{content_type}\n", url],
                      capture_output=True, text=True, timeout=40, check=False)
                  metadata = response.stdout.splitlines()
                  if len(response.stdout) <= 4096 and len(metadata) == 2:
                      status, mime = metadata
                      if len(status) == 3 and status.isascii() and status.isdigit() and 100 <= int(status) <= 599:
                          result["httpStatus"] = int(status)
                      mime = mime.split(";", 1)[0].strip().lower()
                      result["contentType"] = mime if mime in ("application/json", "text/html") else "other" if mime else "missing"
                  result["transportOk"] = response.returncode == 0
                  if result["transportOk"]:
                      payload = body.read_bytes()
                      if len(payload) > 65536:
                          result["transportOk"] = False
                      else:
                          try:
                              data = json.loads(payload.decode("utf-8"), parse_constant=reject_constant)
                              result["jsonValid"] = True
                              if isinstance(data, dict):
                                  result["ready"] = data.get("ready") is True
                                  result["databaseSqlite"] = data.get("database") == "sqlite"
                          except (ValueError, UnicodeError):
                              pass
          except (OSError, ValueError, subprocess.SubprocessError):
              pass
          
          passed = (result["transportOk"] and result["httpStatus"] == 200 and
                    result["contentType"] == "application/json" and result["jsonValid"] and
                    result["ready"] and result["databaseSqlite"])
          print("Public health result: " + json.dumps(result, sort_keys=True))
          if not passed:
              print("::error::Single public health verification failed; no retry or deployment attempted.")
          raise SystemExit(0 if passed else 1)
          PY
