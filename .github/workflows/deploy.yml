name: Verify and deploy WordyLand
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = publish main again; probe = read-only SSH check; rollback = restore previous files'
        type: choice
        options: [deploy, probe, rollback]
        default: deploy
      backup:
        description: 'Backup name for rollback (or latest)'
        type: string
        default: latest
permissions:
  contents: read
concurrency:
  # One production operation at a time; queued runs are never cancelled mid-deploy.
  group: ${{ github.event_name == 'pull_request' && format('wordyland-pr-{0}', github.ref) || 'wordyland-production' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check application JavaScript and shell scripts
        run: |
          for f in dist/*.js; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
          node scripts/test-lessons.mjs
          node scripts/test-pwa.mjs
      - name: Verify account API and database isolation
        run: |
          for f in dist/*.php; do php -l "$f"; done
          python3 scripts/test-api.py
          python3 scripts/test-classroom.py
          python3 scripts/test-adventures.py
          php -l scripts/bootstrap-admin.php
          php -l scripts/siteground-cache.php
          python3 scripts/test-cache-purge.py
          python3 scripts/test-community.py
          python3 scripts/test-presence.py
          python3 scripts/test-resume.py
      - name: Check public bundle
        run: node scripts/verify-bundle.mjs
      - name: Test deployment script in isolation
        run: bash scripts/test-deploy.sh

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' && vars.SG_PATH != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deploy tested commit to SiteGround and verify the live site
        run: bash scripts/deploy-siteground.sh deploy

  probe:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner network
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
      - name: Read-only SSH check (host keys, path, PHP)
        run: bash scripts/deploy-siteground.sh probe

  hostkey-crosscheck:
    # Independent network vantage points for the SSH host key (no credentials used).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_PORT: ${{ vars.SG_PORT }}
    steps:
      - name: Scan host key fingerprints from ${{ matrix.os }}
        shell: bash
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
          ssh-keyscan -T 20 -p "$SG_PORT" "$SG_HOST" 2>/dev/null > scan.txt
          ssh-keygen -lf scan.txt

  rollback:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback' && vars.SG_PATH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
      BACKUP_NAME: ${{ inputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore previous application files (database untouched)
        run: bash scripts/deploy-siteground.sh rollback "$BACKUP_NAME"
