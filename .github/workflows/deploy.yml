name: Verify and deploy WordyLand
on:
  push:
    branches: [main, fix/consistent-play-experience-20261101]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = publish main again; probe = read-only SSH check; rollback = restore previous files'
        type: choice
        options: [deploy, probe, rollback]
        default: deploy
      backup:
        description: 'Backup name for rollback (or latest)'
        type: string
        default: latest
permissions:
  contents: read
concurrency:
  # Main production operations remain serialized. Review-branch verification
  # has its own group and cannot deploy or delay a main release.
  group: ${{ github.ref == 'refs/heads/main' && 'wordyland-production' || format('wordyland-checks-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check application JavaScript and shell scripts
        run: |
          shopt -s nullglob
          for f in dist/*.js dist/*.mjs; do node --check "$f"; done
          for f in scripts/*.sh; do bash -n "$f"; done
          node scripts/test-lessons.mjs
          node scripts/test-pwa.mjs
          node scripts/test-learning.mjs
          node scripts/test-rewards.mjs
          node scripts/test-training-guidance.mjs
          node scripts/test-foundation-expansion.mjs
      - name: Verify account API and database isolation
        run: |
          for f in dist/*.php; do php -l "$f"; done
          python3 scripts/test-api.py
          python3 scripts/test-access.py
          python3 scripts/test-email-recovery.py
          python3 scripts/test-classroom.py
          python3 scripts/test-classroom-access.py
          python3 scripts/test-adventures.py
          python3 scripts/test-holidays.py
          python3 scripts/test-holiday-continuity.py
          python3 scripts/test-learning-bridge.py
          python3 scripts/test-journey.py
          python3 scripts/test-elf.py
          php -l scripts/bootstrap-admin.php
          php -l scripts/owner-recovery-status.php
          php -l scripts/prepare-owner-recovery.php
          php -l scripts/read-only-readiness.php
          python3 scripts/test-read-only-readiness.py
          python3 scripts/test-owner-recovery.py
          php -l scripts/siteground-cache.php
          python3 scripts/test-cache-purge.py
          python3 scripts/test-community.py
          python3 scripts/test-community-activity.py
          python3 scripts/test-api-diagnostics.py
          python3 scripts/test-arena-capacity.py
          python3 scripts/test-data-snapshot.py
          python3 scripts/test-presence.py
          python3 scripts/test-resume.py
          python3 scripts/test-autonomy.py
          python3 scripts/test-review.py
          python3 scripts/test-choice-fairness.py
          python3 scripts/test-parent-summary.py
          python3 scripts/test-training.py
          python3 scripts/test-phonics.py
          python3 scripts/test-letter-progression.py
          python3 scripts/test-training-guidance.py
          python3 scripts/test-holiday-calendar.py
          python3 scripts/test-guardian.py
      - name: Check public bundle
        run: node scripts/verify-bundle.mjs
      - name: Test deployment script in isolation
        run: bash scripts/test-deploy.sh

  browser:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    # Slow Ubuntu mirrors previously consumed12minutes before the suites began.
    # Keep test execution separately bounded; do not spend its budget on setup.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright package
        timeout-minutes: 3
        run: npm install --prefix /tmp/wordyland-browser-deps --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium system dependencies
        timeout-minutes: 15
        run: /tmp/wordyland-browser-deps/node_modules/.bin/playwright install-deps chromium
      - name: Install pinned Chromium
        timeout-minutes: 3
        run: /tmp/wordyland-browser-deps/node_modules/.bin/playwright install chromium
      - name: Verify worlds, events and navigation in isolated browsers
        # Two complete groups retain every suite and assertion deadline.
        # Each group has its own 15-minute execution budget; setup is separate.
        timeout-minutes: 15
        env:
          WORDYLAND_PLAYWRIGHT_MODULE: /tmp/wordyland-browser-deps/node_modules/playwright
        run: |
          export WORDYLAND_CHROMIUM=$(node -p "require(process.env.WORDYLAND_PLAYWRIGHT_MODULE).chromium.executablePath()")
          for check in engine-lazy holiday-continuity holiday-layout wardrobe-layout holiday-rounds world-driving holiday-calendar child-experience game-resilience journey-navigation appearance-consistency classic-illustrated illustrated-actions illustrated world-play christmas-cast elf journey holidays compatibility ux rewards motion performance navigation wardrobe pwa presence community duel-resilience; do bash scripts/test-browser.sh "$check"; done
      - name: Verify learning, accounts and privacy in isolated browsers
        # Two complete groups retain every suite and assertion deadline.
        # Each group has its own 15-minute execution budget; setup is separate.
        timeout-minutes: 15
        env:
          WORDYLAND_PLAYWRIGHT_MODULE: /tmp/wordyland-browser-deps/node_modules/playwright
        run: |
          export WORDYLAND_CHROMIUM=$(node -p "require(process.env.WORDYLAND_PLAYWRIGHT_MODULE).chromium.executablePath()")
          for check in classroom-access learning-entry training-memory interaction-focus training-guidance guardian learning-experience account-resilience duel-identity offline-audio pdf-scan ocr materials learning resume access email autonomy review parent-summary tiles wallet training spelling letter-progression foundations offline-training offline-letters phonics; do bash scripts/test-browser.sh "$check"; done

  deploy:
    needs: [verify, browser]
    if: >-
      github.ref == 'refs/heads/main' && vars.SG_PATH != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deploy tested commit to SiteGround and verify the live site
        run: bash scripts/deploy-siteground.sh deploy

  probe:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner network
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
      - name: Read-only SSH check (host keys, path, PHP)
        run: bash scripts/deploy-siteground.sh probe

  hostkey-crosscheck:
    # Independent network vantage points for the SSH host key (no credentials used).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_PORT: ${{ vars.SG_PORT }}
    steps:
      - name: Scan host key fingerprints from ${{ matrix.os }}
        shell: bash
        run: |
          echo "Runner public IP: $(curl -fsS https://api.ipify.org || echo unknown)"
          ssh-keyscan -T 20 -p "$SG_PORT" "$SG_HOST" 2>/dev/null > scan.txt
          ssh-keygen -lf scan.txt

  rollback:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback' && vars.SG_PATH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SG_HOST: ${{ vars.SG_HOST }}
      SG_USER: ${{ vars.SG_USER }}
      SG_PORT: ${{ vars.SG_PORT }}
      SG_PATH: ${{ vars.SG_PATH }}
      SG_PRIVATE_KEY: ${{ secrets.SG_PRIVATE_KEY }}
      SG_KEY_PASSPHRASE: ${{ secrets.SG_KEY_PASSPHRASE }}
      SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
      BACKUP_NAME: ${{ inputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore previous application files (database untouched)
        run: bash scripts/deploy-siteground.sh rollback "$BACKUP_NAME"
